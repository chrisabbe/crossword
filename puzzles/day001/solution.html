<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crossword Solution</title>

<!-- Shared site shell -->
<link rel="stylesheet" href="/crossword/common/site-shell.css">

<style>
  body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:0;
    color:#222;
  }

  .solution-header{
    background:#008080;
    color:#fff;
    text-align:center;
    padding:18px 10px;
    font-size:26px;
    font-weight:700;
  }

  .solution-subtitle{
    text-align:center;
    color:#555;
    font-style:italic;
    margin:8px 0 16px;
    font-size:15px;
  }

  .container{
    max-width:900px;
    margin:auto;
    padding:10px;
  }

  .grid-wrapper{
    display:flex;
    justify-content:center;
    overflow-x:auto;
  }

  table.solution{
    border-collapse:collapse;
    user-select:none;
  }

  table.solution td{
    width:32px;
    height:32px;
    border:1px solid #777;
    text-align:center;
    vertical-align:middle;
    font-size:20px;
    font-weight:700;
    color:#005f5f;
    text-transform:uppercase;
    background:#fff;
  }

  /* Gold blocks */
  td.block{
    background:#d8c178;
    color:transparent;
  }

  @media (max-width:600px){
    table.solution td{
      width:26px;
      height:26px;
      font-size:18px;
    }
  }

  @media (max-width:420px){
    table.solution td{
      width:22px;
      height:22px;
      font-size:16px;
    }
  }
</style>
</head>

<body>

<!-- Injected site header -->
<div id="site-header"></div>

<div class="solution-header">DAILY CROSSWORD — SOLUTION</div>
<div id="subtitleEl" class="solution-subtitle"></div>

<div class="container">
  <div id="solutionArea"></div>
</div>

<!-- Injected site footer -->
<div id="site-footer"></div>

<!-- INLINE PARTIAL LOADER (matches puzzle page exactly) -->
<script>
  function loadPartial(targetId, url) {
    fetch(url)
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(html => {
        const el = document.getElementById(targetId);
        if (el) el.innerHTML = html;
      })
      .catch(err => console.error("Failed to load partial:", url, err));
  }

  loadPartial("site-header", "/crossword/common/header.html");
  loadPartial("site-footer", "/crossword/common/footer.html");
</script>

<script>
fetch("puzzle.json", { cache: "no-store" })
  .then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(raw => normalizeAndBuild(raw))
  .catch(err => {
    console.error(err);
    document.getElementById("solutionArea").innerHTML =
      "<div style='text-align:center;color:#b00000;font-weight:700;'>Solution unavailable.</div>";
  });

function normalizeAndBuild(raw){
  // Support v0 and v1 schemas
  const p = raw.meta ? raw : {
    meta: { title: raw.title, subtitle: raw.subtitle },
    size: { rows: raw.rows, cols: raw.cols },
    solution: raw.solution
  };

  document.title =
    (p.meta?.title || "Crossword Solution") + " — Solution";

  document.getElementById("subtitleEl").textContent =
    p.meta?.subtitle
      ? `Completed grid for: ${p.meta.subtitle}`
      : "Completed grid.";

  buildSolution(p);
}

function buildSolution(p){
  const wrap = document.createElement("div");
  wrap.className = "grid-wrapper";

  const tbl = document.createElement("table");
  tbl.className = "solution";

  for(let r=0; r<p.size.rows; r++){
    const tr = document.createElement("tr");

    for(let c=0; c<p.size.cols; c++){
      const td = document.createElement("td");
      const val = p.solution?.[r]?.[c];

      if (val === "#" || val === ".") {
        td.classList.add("block");
      } else {
        td.textContent = String(val || "").toUpperCase();
      }

      tr.appendChild(td);
    }

    tbl.appendChild(tr);
  }

  wrap.appendChild(tbl);
  document.getElementById("solutionArea").appendChild(wrap);
}
</script>

</body>
</html>
